# Embedded H2 (active by default via spring.profiles.default=dev). Override with --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:mem:uniflow;MODE=MYSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
