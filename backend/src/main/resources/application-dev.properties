# Local admin (dev profile; merged by AdminUserSeeder on startup). Override with backend/.env or env vars in production.
ADMIN_EMAIL=irosh@gmail.com
ADMIN_PASSWORD=123456

# File-based H2 so users & passwords survive backend restarts (./data/ under the process working directory, e.g. backend/data).
# Delete backend/data/ if the schema is corrupted. Override with --spring.profiles.active=mysql
spring.datasource.url=jdbc:h2:file:./data/uniflow-dev;MODE=MYSQL;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
