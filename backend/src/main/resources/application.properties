spring.application.name=helpdesk-backend

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/helpdesk_db?useSSL=false&serverTimezone=Asia/Colombo&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Umesha@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ===============================
# Server Configuration
# ===============================
server.port=8080

# ===============================
# File Upload Configuration
# ===============================
file.upload-dir=uploads

# ===============================
# CORS
# ===============================
# handled in code

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.paf.helpdesk=DEBUG