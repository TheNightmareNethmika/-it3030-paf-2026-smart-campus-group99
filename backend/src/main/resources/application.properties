spring.application.name=uniflow

# Local: embedded H2 (see application-dev.properties). Use MySQL with --spring.profiles.active=mysql
spring.profiles.default=dev

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server Configuration
# ===============================
# Default 10200 (rarely used by other apps). In dev, first free port in range is used; see DevEmbeddedServerPortCustomizer.
server.port=${SERVER_PORT:10200}

# ===============================
# File Upload Configuration
# ===============================
file.upload-dir=uploads

# ──────────────────────────────────────────────────────────────
# Google OAuth2 Credentials
# ──────────────────────────────────────────────────────────────
# 1. Go to https://console.cloud.google.com
# 2. Create a project (or select an existing one)
# 3. Navigate to: APIs & Services → Credentials → Create Credentials → OAuth 2.0 Client IDs
# 4. Application type: Web application
# 5. Add Authorized redirect URI:
#       http://localhost:10200/login/oauth2/code/google
# 6. Copy the Client ID and Client Secret below.
# ──────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.uniflow.system=DEBUG
logging.level.com.paf.helpdesk=DEBUG
