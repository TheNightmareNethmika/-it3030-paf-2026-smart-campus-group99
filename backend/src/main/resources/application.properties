spring.application.name=uniflow

# ===============================
# MySQL Database Configuration
# ===============================
spring.datasource.url=${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/mydb?createDatabaseIfNotExist=true}
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:newpassword123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# JPA / Hibernate Configuration
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ===============================
# Server Configuration
# ===============================
server.port=${SERVER_PORT:8081}

# ===============================
# File Upload Configuration
# ===============================
file.upload-dir=uploads

# ──────────────────────────────────────────────────────────────
# Google OAuth2 Credentials
# ──────────────────────────────────────────────────────────────
# 1. Go to https://console.cloud.google.com
# 2. Create a project (or select an existing one)
# 3. Navigate to: APIs & Services → Credentials → Create Credentials → OAuth 2.0 Client IDs
# 4. Application type: Web application
# 5. Add Authorized redirect URI:
#       http://localhost:8081/login/oauth2/code/google
# 6. Copy the Client ID and Client Secret below.
# ──────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:YOUR_GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

# ===============================
# Logging
# ===============================
logging.level.org.springframework=INFO
logging.level.com.uniflow.system=DEBUG
logging.level.com.paf.helpdesk=DEBUG
